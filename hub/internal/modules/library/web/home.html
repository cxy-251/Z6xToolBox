<title>{{name}}</title>
<style>
body{overscroll-behavior-y:contain}
#top{position:sticky;top:0;z-index:5;background:rgba(13,17,23,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:flex-end}
#tabs{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;padding:4px 6px 0;scrollbar-width:none}
/* 行末下拉菜单：当前标签的分类（游戏：RPG / SLG；短视频：平台） */
#sub{flex:none;margin:0 8px 6px 4px;max-width:46vw;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 10px;color:var(--muted);white-space:nowrap}
#tabs button.on{color:var(--fg);border-bottom-color:var(--accent);background:transparent}
#tabs .n{font-size:11px;color:var(--muted);margin-left:3px}
.pane{display:none;padding:12px 14px 40px}.pane.on{display:block}
.pane.frame{padding:0}.pane.frame iframe{display:block;width:100%;height:calc(100vh - 44px);border:0;background:var(--bg)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tools input[type=search]{flex:1;max-width:320px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.game{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--fg);text-decoration:none;transition:border-color .15s,transform .15s}
.game:hover{border-color:var(--accent);transform:translateY(-2px)}
.game img{width:72px;height:72px;object-fit:contain;border-radius:14px;background:#0d1117}
.game span{font-size:13px;text-align:center;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;color:var(--fg);text-decoration:none}
.book img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#0d1117}
.book span{display:block;padding:6px 8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{font-size:12px;padding:4px 6px 4px 10px;border-radius:14px;display:inline-flex;align-items:center;gap:4px}
.chips button .c{color:var(--muted)}.chips button.on .c{color:#dbe9ff}
.chips .pin{opacity:.35;font-size:11px;padding:0 2px;filter:grayscale(1)}.chips .pin.on{opacity:1;filter:none}
.chips button:hover .pin{opacity:.8}
.more{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px}
.more input{width:100%;max-width:280px;margin-bottom:8px}
.more .chips{max-height:220px;overflow-y:auto;margin:0}
.svgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.clip{cursor:pointer;min-width:0}
.clip .cv{position:relative;aspect-ratio:9/16;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:12px;transition:transform .15s}
.clip:hover .cv{transform:translateY(-2px)}
.clip .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.clip .cv .ph{font-size:13px;line-height:1.45;color:rgba(255,255,255,.9);text-align:center;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.clip .k{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;padding:1px 7px;border-radius:8px;z-index:1}
.clip .h{position:absolute;top:6px;right:8px;font-size:14px;z-index:1}
.clip .t{font-size:13px;line-height:1.4;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clip .f{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
#sentinel{height:40px}
#pl{position:fixed;inset:0;z-index:20;background:#000;display:none;touch-action:none}
#pl.on{display:block}
#pl video,#pl img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#pl img{display:none}
/* 图集：两侧翻页按钮、点图片左半边 / 右半边翻页、底部页码 */
#pl .pg{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:30px;display:none;z-index:2;padding:0}
#pgl{left:10px}#pgr{right:66px}
#pl.album .pg,#pl.album #pgn{display:block}
#pgn{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:13px;padding:3px 12px;border-radius:12px;display:none;z-index:2}
#pl.idle .pg,#pl.idle #pgn{opacity:.25}
#pl .ui{position:absolute;left:0;right:0;padding:12px 14px;background:linear-gradient(rgba(0,0,0,.7),transparent);display:flex;gap:8px;align-items:center;transition:opacity .3s}
#pl .ui.b{bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));flex-wrap:wrap}
#pl .ui button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:18px;padding:6px 12px}
#pl .ui button.on{background:var(--accent)}
#pl #ptitle{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pl #pmeta{font-size:12px;color:#c9d1d9}
#pl input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
#pl .side{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
#pl .side button{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);border:0;color:#fff;font-size:18px;padding:0}
#pl.idle .ui,#pl.idle .side{opacity:0}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#238636;color:#fff;padding:8px 16px;border-radius:8px;z-index:30;display:none}
</style>
<div id="top">
  <div id="tabs"></div><select id="sub" style="display:none"></select>
</div>
<div id="panes"></div>
<div id="pl">
  <video id="pv" playsinline preload="auto"></video><img id="pi" alt="">
  <button class="pg" id="pgl" title="上一张（←）">‹</button><button class="pg" id="pgr" title="下一张（→）">›</button><span id="pgn"></span>
  <div class="ui" style="top:0"><button id="pclose">✕</button><span id="ptitle"></span><span id="pmeta"></span></div>
  <div class="side"><button id="pprev" title="上一个（↑）">▲</button><button id="plike" title="喜欢（L）">♡</button><button id="pnext" title="下一个（↓）">▼</button></div>
  <div class="ui b"><button id="pplay">⏸</button><input type="range" id="pseek" min="0" max="1000" value="0"><span id="ptime" class="muted">0:00</span>
    <button id="ploop"></button><button id="pmute"></button></div>
</div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id), enc=encodeURIComponent;
const get=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(await r.text());return r.json()};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',1500)}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
const fmtDate=d=>d?String(d).replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3'):'';
const fmtTime=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
function hue(s){let h=0;for(const c of s)h=(h*31+c.codePointAt(0))%360;return h}

/* ---------- 标签：内容来自各接口，没有内容的分类不显示；首次点开时才加载 ---------- */
const tabs=[];
// init(面板, 标签)；有分类的标签在 init 中设置 t.subs（[{id,label,count}]）、t.cur 与 t.pick(id)，行末下拉菜单据此显示
function addTab(id,label,count,init){tabs.push({id,label,count,init,ready:false})}
let games=[];
async function boot(){
  const [gs,pf,mg,mods]=await Promise.all([get('/api/library/games').catch(()=>[]),get('/api/library/shortvideo/platforms').catch(()=>[]),
    get('/api/library/manga').catch(()=>[]),get('/api/modules').catch(()=>[])]);
  games=gs;
  const n=t=>gs.filter(g=>g.type===t).length;
  const types=[['rpg','🗡️ RPG'],['slg','♟️ SLG']].filter(([id])=>n(id)).map(([id,label])=>({id,label,count:n(id)}));
  if(types.length)addTab('games','🎮 游戏',gs.length,(p,t)=>subTab(p,t,types,'z6x-game-type',(pane,id)=>gamePane(pane,id)));
  const pfs=pf.filter(p=>p.count).map(p=>({id:p.id,label:{douyin:'🎬 ',kuaishou:'📱 ',tiktok:'🎵 '}[p.id]+p.title,count:p.count,info:p}));
  if(pfs.length)addTab('sv','📱 短视频',pfs.reduce((n,p)=>n+p.count,0),(p,t)=>subTab(p,t,pfs,'z6x-sv-platform',(pane,id)=>svPane(pane,id,pfs.find(x=>x.id===id).info)));
  addTab('matrix','📺 多联放映',0,p=>frame(p,'/ui/library/matrix/'));
  addTab('audio','🎧 音声',0,p=>frame(p,'/ui/library/audio/'));
  if(mg.length)addTab('manga','🖼️ 漫画',mg.length,p=>mangaPane(p,mg));
  addTab('novels','📖 小说',0,p=>frame(p,'/ui/library/novels/'));
  for(const m of mods)if(m.title&&m.name!=='library'&&m.state==='running')addTab('m-'+m.name,'🔧 '+m.title,0,p=>frame(p,'/ui/'+m.name+'/'));
  addTab('storage','🗄️ 存储',0,p=>frame(p,'/ui/library/storage?tab=libs'));
  addTab('system','⚙️ 系统',0,p=>frame(p,'/ui/hub/'));
  const bar=$('tabs');
  for(const t of tabs){const b=el('button');b.dataset.id=t.id;b.append(t.label);if(t.count)b.append(el('span','n',t.count));b.onclick=()=>show(t.id);bar.append(b);
    const p=el('div','pane');p.id='pane-'+t.id;$('panes').append(p);t.pane=p}
  const want=location.hash.slice(1)||store.get('z6x-home-tab','');
  show(tabs.some(t=>t.id===want)?want:tabs[0].id);
}
function show(id){
  for(const t of tabs)t.pane.classList.toggle('on',t.id===id);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  const t=tabs.find(t=>t.id===id);if(!t.ready){t.ready=true;t.init(t.pane,t)}
  const sel=$('sub');sel.style.display=t.subs?'':'none';
  if(t.subs){sel.replaceChildren(...t.subs.map(s=>new Option(s.label+'  '+s.count,s.id)));sel.value=t.cur;sel.onchange=()=>t.pick(sel.value)}
  history.replaceState(null,'','#'+id);store.set('z6x-home-tab',id);
  document.querySelector('#tabs button.on')?.scrollIntoView({inline:'nearest',block:'nearest'});
}
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(tabs.some(t=>t.id===id))show(id)});
function frame(p,src){p.classList.add('frame');const f=el('iframe');f.src=src;f.loading='lazy';p.append(f)}

/* ---------- 游戏 ---------- */
function gamePane(p,type){
  const list=games.filter(g=>g.type===type).sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  const tools=el('div','tools'),q=el('input');q.type='search';q.placeholder='按名称筛选';tools.append(q,el('span','muted','共 '+list.length+' 款，在新标签页中打开'));
  const grid=el('div','grid');p.append(tools,grid);
  const render=()=>{grid.innerHTML='';const k=q.value.trim().toLowerCase();
    for(const g of list){if(k&&!g.name.toLowerCase().includes(k))continue;
      const a=el('a','game');a.href='/game/'+enc(g.id)+'/'+g.entry.split('/').map(enc).join('/');a.target='_blank';
      const i=el('img');i.loading='lazy';i.src='/icon/'+enc(g.id);i.alt='';a.append(i,el('span','',g.name));a.title=g.name;grid.append(a)}};
  q.oninput=render;render();
}

/* ---------- 漫画 ---------- */
function mangaPane(p,list){
  const tools=el('div','tools'),q=el('input');q.type='search';q.placeholder='按名称筛选';tools.append(q,el('span','muted','共 '+list.length+' 部'));
  const grid=el('div','grid');p.append(tools,grid);
  const render=()=>{grid.innerHTML='';const k=q.value.trim().toLowerCase();
    for(const x of list){if(k&&!x.name.toLowerCase().includes(k))continue;
      const a=el('a','book');a.href='/ui/library/read?id='+enc(x.id);a.target='_blank';const i=el('img');i.loading='lazy';i.src='/api/library/manga/thumb?id='+enc(x.id);a.append(i,el('span','',x.name));a.title=x.name;grid.append(a)}};
  q.oninput=render;render();
}

/* ---------- 有分类的标签：每个分类一个子面板，首次选中时创建，切换时保留各自的状态 ---------- */
function subTab(pane,t,subs,key,make){
  const panes={};t.subs=subs;
  t.pick=id=>{t.cur=id;store.set(key,id);$('sub').value=id;
    for(const k in panes)panes[k].style.display=k===id?'':'none';
    if(!panes[id]){panes[id]=el('div');pane.append(panes[id]);make(panes[id],id)}};
  const last=store.get(key,'');t.pick(subs.some(s=>s.id===last)?last:subs[0].id);
}

/* ---------- 短视频（与 omni-deck 的短视频画廊相同的用法）：平台在行末下拉菜单中切换；📌 置顶的博主排在第一行 ---------- */
const PAGE=48;
function svPane(p,platform,info){
  const st={platform,folder:'',q:'',liked:false,items:[],total:0,loading:false,seq:0,folders:[],moreOpen:false,authorQ:''};
  const tools=el('div','tools'),q=el('input');q.type='search';q.placeholder='🔍 搜索标题或博主';
  const likeBtn=el('button','','♡ 只看喜欢'),count=el('span','muted');tools.append(q,likeBtn,count);
  // 封面由手机上的 thumbs.sh 生成，hub 每 10 分钟重新扫描一次；未完成时显示进度
  if(info&&info.thumbs<info.count){const t=el('span','muted','封面 '+info.thumbs+'/'+info.count);t.title='封面在手机上后台生成（Termux 中执行 thumbs status 查看）';tools.append(t)}
  const chips=el('div','chips'),morePanel=el('div','more'),grid=el('div','svgrid'),sentinel=el('div');sentinel.style.height='40px';
  morePanel.style.display='none';const empty=el('div','empty','没有作品');empty.style.display='none';
  p.append(tools,chips,morePanel,grid,empty,sentinel);
  function chip(f){
    const b=el('button',st.folder===f.name?'on':'');b.append(f.name,el('span','c',f.count));b.title=f.name;b.onclick=()=>pick(f.name);
    const pin=el('span','pin'+(f.pinned?' on':''),'📌');pin.title=f.pinned?'取消置顶':'置顶到第一行';
    pin.onclick=async e=>{e.stopPropagation();const on=!f.pinned;
      const r=await fetch('/api/library/shortvideo/pin?platform='+enc(platform)+'&folder='+enc(f.name)+'&pinned='+(on?1:0),{method:'POST'});
      if(!r.ok)return toast('置顶没有保存');f.pinned=on;renderChips();toast(on?'已置顶 '+f.name:'已取消置顶')};
    b.append(pin);return b}
  function renderChips(){
    const pinned=st.folders.filter(f=>f.pinned),rest=st.folders.filter(f=>!f.pinned);
    chips.replaceChildren();const all=el('button',st.folder?'':'on');all.append('全部',el('span','c',st.folders.reduce((n,f)=>n+f.count,0)));all.onclick=()=>pick('');chips.append(all);
    for(const f of pinned)chips.append(chip(f));
    const cur=rest.find(f=>f.name===st.folder);if(cur)chips.append(chip(cur)); // 当前选中的博主也显示在第一行
    if(rest.length){const t=el('button','',(st.moreOpen?'收起':'更多博主')+' ('+rest.length+') '+(st.moreOpen?'▴':'▾'));t.onclick=()=>{st.moreOpen=!st.moreOpen;renderChips()};chips.append(t)}
    morePanel.style.display=st.moreOpen?'':'none';
    if(st.moreOpen){morePanel.replaceChildren();const s=el('input');s.type='search';s.placeholder='搜索博主';s.value=st.authorQ;
      const box=el('div','chips');const fill=()=>{box.replaceChildren();const k=st.authorQ.toLowerCase();for(const f of rest)if(!k||f.name.toLowerCase().includes(k))box.append(chip(f))};
      s.oninput=()=>{st.authorQ=s.value.trim();fill()};morePanel.append(s,box);fill()}
  }
  async function loadFolders(){st.folders=await get('/api/library/shortvideo/folders?platform='+enc(platform));st.folders.sort((a,b)=>b.count-a.count);renderChips()}
  function pick(f){st.folder=f;renderChips();reset()}
  function query(off){return '/api/library/shortvideo/items?platform='+enc(platform)+'&folder='+enc(st.folder)+'&q='+enc(st.q)+(st.liked?'&liked=1':'')+'&offset='+off+'&limit='+PAGE}
  async function more(){
    if(st.loading||(st.items.length&&st.items.length>=st.total))return false;
    st.loading=true;const seq=st.seq;
    try{const r=await get(query(st.items.length));if(seq!==st.seq)return false;
      st.total=r.total;const start=st.items.length;st.items.push(...r.items);r.items.forEach((it,i)=>grid.append(card(it,start+i)));
      count.textContent='共 '+st.total+' 条';empty.style.display=st.total?'none':'block';return r.items.length>0}
    finally{if(seq===st.seq)st.loading=false}
  }
  function reset(){st.seq++;st.loading=false;st.items=[];st.total=0;grid.replaceChildren();more()}
  function card(it,i){
    const c=el('div','clip'),cv=el('div','cv'),h=hue(it.folder);cv.style.background='linear-gradient(160deg,hsl('+h+',45%,30%),hsl('+(h+40)%360+',50%,14%))';
    cv.append(el('div','ph',it.title));
    if(it.thumb){const im=el('img');im.loading='lazy';im.alt='';im.src=it.thumb;im.onerror=()=>im.remove();cv.append(im)}
    cv.append(el('span','k',it.kind==='images'?'🖼 '+it.images.length:'▶'));if(it.liked)cv.append(el('span','h','❤️'));
    c.append(cv,el('div','t',it.title),el('div','f',it.folder+(it.date?' · '+fmtDate(it.date):'')));
    c.onclick=()=>player.open(st,i,more);return c}
  let qt;q.oninput=()=>{clearTimeout(qt);qt=setTimeout(()=>{st.q=q.value.trim();reset()},300)};
  likeBtn.onclick=()=>{st.liked=!st.liked;likeBtn.classList.toggle('on',st.liked);likeBtn.textContent=st.liked?'❤️ 只看喜欢':'♡ 只看喜欢';reset()};
  st.refreshCard=i=>{const old=grid.children[i];if(old)old.replaceWith(card(st.items[i],i))};
  new IntersectionObserver(es=>{if(es[0].isIntersecting&&p.offsetParent)more()},{rootMargin:'600px'}).observe(sentinel);
  loadFolders();reset();
}

/* ---------- 播放器：视频与图集共用；↑↓ 切换作品，←→ 图集翻页，空格暂停，L 喜欢，M 静音，Esc 关闭 ---------- */
const player=(()=>{
  const pl=$('pl'),v=$('pv'),img=$('pi');let st=null,i=0,page=0,moreFn=null;
  const loops=[['list','🔁 顺序'],['one','🔂 单个'],['shuffle','🔀 随机']];
  let loop=store.get('z6x-sv-loop','list');v.muted=store.get('z6x-sv-muted',false);
  const ui=()=>{$('ploop').textContent=loops.find(l=>l[0]===loop)[1];$('pmute').textContent=v.muted?'🔇 静音':'🔊 声音'};ui();
  const cur=()=>st&&st.items[i];
  function render(){const it=cur();if(!it)return;
    $('ptitle').textContent=it.title;$('plike').textContent=it.liked?'❤️':'♡';
    pl.classList.toggle('album',it.kind==='images');
    if(it.kind==='images'){v.pause();v.removeAttribute('src');v.style.display='none';img.style.display='block';img.src=it.images[page];
      // 预取下一张，翻页时不用等
      if(page+1<it.images.length)(new Image()).src=it.images[page+1];
      $('pgn').textContent=(page+1)+' / '+it.images.length;
      $('pmeta').textContent=it.folder+' · '+(i+1)+'/'+st.total;$('pplay').style.display=$('pseek').style.display=$('ptime').style.display='none'}
    else{img.style.display='none';v.style.display='block';$('pplay').style.display=$('pseek').style.display=$('ptime').style.display='';
      v.src=it.url;v.play().catch(()=>{});$('pmeta').textContent=it.folder+' · '+(i+1)+'/'+st.total}
    $('pplay').textContent='⏸'}
  async function go(d){if(!st)return;let n;
    // 随机只在已加载的作品中挑选，避免为了取到远处的序号连续加载大量分页
    if(loop==='shuffle'&&d>0)n=Math.floor(Math.random()*st.items.length);else n=i+d;
    if(n<0)return toast('已经是第一个');
    while(n>=st.items.length){if(!(await moreFn()))break}
    if(n>=st.items.length)return toast('已经是最后一个');
    i=n;page=0;render()}
  function open(s,idx,more){st=s;i=idx;page=0;moreFn=more;pl.classList.add('on');document.body.style.overflow='hidden';render();idle()}
  function close(){v.pause();v.removeAttribute('src');v.load();pl.classList.remove('on');document.body.style.overflow='';st=null}
  async function like(){const it=cur();if(!it)return;const on=!it.liked;
    const r=await fetch('/api/library/shortvideo/like?platform='+enc(st.platform)+'&rel_path='+enc(it.rel_path)+'&liked='+(on?1:0),{method:'POST'});
    if(!r.ok)return toast('操作失败');it.liked=on;$('plike').textContent=on?'❤️':'♡';st.refreshCard(i);toast(on?'已喜欢':'已取消喜欢')}
  function flip(d){const it=cur();if(!it||it.kind!=='images')return go(d);const n=page+d;if(n<0||n>=it.images.length)return go(d);page=n;render()}
  v.onended=()=>{if(loop==='one'){v.currentTime=0;v.play()}else go(1)};
  v.ontimeupdate=()=>{if(v.duration){$('pseek').value=v.currentTime/v.duration*1000;$('ptime').textContent=fmtTime(v.currentTime)+' / '+fmtTime(v.duration)}};
  $('pseek').oninput=e=>{if(v.duration)v.currentTime=e.target.value/1000*v.duration};
  $('pplay').onclick=()=>{v.paused?v.play():v.pause();$('pplay').textContent=v.paused?'▶':'⏸'};
  $('pclose').onclick=close;$('pprev').onclick=()=>go(-1);$('pnext').onclick=()=>go(1);$('plike').onclick=like;
  $('ploop').onclick=()=>{loop=loops[(loops.findIndex(l=>l[0]===loop)+1)%loops.length][0];store.set('z6x-sv-loop',loop);ui();toast($('ploop').textContent)};
  $('pmute').onclick=()=>{v.muted=!v.muted;store.set('z6x-sv-muted',v.muted);ui()};
  document.addEventListener('keydown',e=>{if(!st||e.target.tagName==='INPUT')return;
    const k={Escape:close,ArrowUp:()=>go(-1),ArrowDown:()=>go(1),ArrowLeft:()=>flip(-1),ArrowRight:()=>flip(1),' ':()=>$('pplay').click(),l:like,L:like,m:()=>$('pmute').click(),M:()=>$('pmute').click()}[e.key];
    if(k){e.preventDefault();k()}idle()});
  let wt=0;pl.addEventListener('wheel',e=>{const now=Date.now();if(now-wt<500)return;wt=now;go(e.deltaY>0?1:-1)},{passive:true});
  let sx=0,sy=0;pl.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;idle()},{passive:true});
  pl.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dy)>60&&Math.abs(dy)>Math.abs(dx))go(dy<0?1:-1);else if(Math.abs(dx)>60)flip(dx<0?1:-1)},{passive:true});
  v.onclick=()=>$('pplay').click();
  // 图集：点图片左半边上一张、右半边下一张；两侧按钮同样。第一张再往前 / 最后一张再往后切换到上一个 / 下一个作品
  img.onclick=e=>{flip(e.clientX<window.innerWidth/2?-1:1);idle()};
  $('pgl').onclick=e=>{e.stopPropagation();flip(-1);idle()};$('pgr').onclick=e=>{e.stopPropagation();flip(1);idle()};
  let it2;function idle(){pl.classList.remove('idle');clearTimeout(it2);it2=setTimeout(()=>pl.classList.add('idle'),2500)}
  pl.addEventListener('mousemove',idle);
  return {open};
})();

boot();
</script>
