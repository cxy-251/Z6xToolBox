<title>音声</title><style>
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;padding:12px 12px 140px}
.al{cursor:pointer;min-width:0}
.al .cv{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:34px;color:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.al .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.al .cv .n{position:absolute;right:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:8px}
.al b{display:block;font-size:13px;font-weight:500;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#trackView{display:none;padding-bottom:140px}
.ahead{display:flex;gap:14px;align-items:flex-end;padding:14px 12px;border-bottom:1px solid var(--line)}
.ahead .cv{width:120px;flex:none}.ahead b{font-size:17px}
#list{padding:0 12px}
.tr{display:flex;gap:10px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.tr:hover{background:var(--card)}.tr.on{color:var(--accent)}
.tr .i{width:24px;text-align:right;color:var(--muted);font-size:12px}
.tr .t{flex:1;word-break:break-all}.tr .a{font-size:12px;color:var(--muted)}
#player{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 12px;display:none;z-index:3}
#player .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#pcov{width:40px;height:40px;border-radius:6px;object-fit:cover;background:#21262d}
#ptitle{flex:1;min-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seek{width:100%;margin:6px 0 2px}
#chap{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:4;align-items:flex-end;justify-content:center}
#chap .box{background:var(--card);width:100%;max-width:640px;max-height:70vh;overflow:auto;border-radius:12px 12px 0 0;padding:12px}
#chap .c{padding:8px;border-bottom:1px solid var(--line);cursor:pointer}#chap .c.on{color:var(--accent)}
</style></head><body>
<header><h1>🎧 音声</h1><span id="srcs" style="display:flex;gap:6px"></span>
<select id="artist" style="display:none;max-width:220px"></select><input type="search" id="q" placeholder="搜索专辑、歌手、曲名"><span class="muted" id="count"></span><span style="flex:1"></span><a href="/ui/library/">返回资源库</a></header>
<div id="albumView"><div class="agrid" id="grid"></div><div id="sent" style="height:40px"></div></div>
<div id="trackView"><div class="ahead"><div class="al"><div class="cv" id="acov"></div></div><div style="min-width:0"><button id="backBtn">← 全部专辑</button>
<p style="margin:8px 0 4px"><b id="aname"></b></p><div class="muted" id="ainfo"></div><p style="margin:8px 0 0"><button id="playAll" class="on">▶ 播放全部</button></p></div></div>
<div id="list"></div></div>
<div id="player"><div class="row"><img id="pcov" alt=""><span id="ptitle"></span><span class="muted" id="ptime">0:00</span></div>
<input type="range" id="seek" min="0" max="1000" value="0">
<div class="row"><button id="prev">⏮</button><button id="back">-15s</button><button id="play">⏸</button><button id="fwd">+30s</button><button id="next">⏭</button>
<button id="mode"></button><button id="rate">1x</button><button id="sleep">⏾ 关</button><button id="chapBtn" style="display:none">章节</button></div></div>
<div id="chap"><div class="box" id="chapBox"></div></div>
<audio id="au" preload="metadata"></audio>
<script>
const $=id=>document.getElementById(id), enc=encodeURIComponent, au=$('au');
const el=(t,x,c)=>{const e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e};
const fmt=t=>{t=Math.floor(t||0);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=String(t%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+s:m+':'+s};
const MODES=[['list','🔁 列表'],['single','🔂 单曲'],['random','🔀 随机']], RATES=[0.75,1,1.25,1.5,1.75,2], SLEEPS=[0,15,30,60,90];
let source=localStorage.getItem('z6x-au-src')||'', all=[], albums=[], shownA=0, view=[], cur=null, mode=localStorage.getItem('z6x-au-mode')||'list', rate=+localStorage.getItem('z6x-au-rate')||1;
let artist='', sleepIdx=0, sleepAt=0, chapters=[], saveTick=0;
// 续听记录的键：常规、NSFW 与 omni-deck 相同（std:、nsfw: 加相对路径）
const key=t=>({nsfw:'nsfw:',music:'music:'}[t.source]||'std:')+t.rel_path;
const cover=t=>'/api/library/audio/cover?src='+enc(t.stream_url);
function hue(s){let h=0;for(const c of s)h=(h*31+c.codePointAt(0))%360;return h}
// 封面：专辑第一首的内嵌图片；读不到时显示按专辑名着色的色块
function coverBox(a,box){box.replaceChildren();const h=hue(a.name+a.artist);
  box.style.background='linear-gradient(135deg,hsl('+h+',45%,35%),hsl('+(h+50)%360+',50%,16%))';box.append(source==='music'?'🎵':'🎧');
  const i=el('img');i.loading='lazy';i.alt='';i.src=cover(a.tracks[0]);i.onerror=()=>i.remove();box.append(i)}

async function load(){
  $('grid').textContent='读取中…';
  let r=await (await fetch('/api/library/audio?source='+(source||'music'))).json();
  if(!source){source=r.has_music?'music':'standard';if(!r.has_music)r=await (await fetch('/api/library/audio?source=standard')).json()}
  // 来源按钮：手机上音乐排在最前
  const srcs=$('srcs');srcs.replaceChildren();
  for(const [id,label] of (r.has_music?[['music','🎵 音乐']]:[]).concat([['standard','常规'],['nsfw','NSFW']])){
    const b=el('button',label,id===source?'on':'');b.onclick=()=>{source=id;localStorage.setItem('z6x-au-src',id);load()};srcs.append(b)}
  all=r.tracks;artist='';
  const m=new Map();
  for(const t of all){const k=(t.artist||'')+'\u0000'+t.album;if(!m.has(k))m.set(k,{name:t.album,artist:t.artist||'',tracks:[]});m.get(k).tracks.push(t)}
  albums=[...m.values()];
  if(source==='music')albums.sort((a,b)=>a.artist.localeCompare(b.artist,'zh')||a.name.localeCompare(b.name,'zh'));
  else albums.sort((a,b)=>b.tracks.length-a.tracks.length);
  // 音乐：歌手很多，用下拉框筛选歌手
  const sel=$('artist');sel.style.display=source==='music'?'':'none';
  if(source==='music'){const ac={};albums.forEach(a=>ac[a.artist]=(ac[a.artist]||0)+1);
    sel.replaceChildren(new Option('全部歌手 ('+Object.keys(ac).length+')',''));
    Object.keys(ac).sort((a,b)=>a.localeCompare(b,'zh')).forEach(a=>sel.append(new Option(a.trim()+' ('+ac[a]+' 张)',a)))}
  showAlbums();filter();
}
let shownList=[];
function filter(){
  const q=$('q').value.trim().toLowerCase();
  shownList=albums.filter(a=>(!artist||a.artist===artist)&&(!q||a.name.toLowerCase().includes(q)||a.artist.toLowerCase().includes(q)||a.tracks.some(t=>t.title.toLowerCase().includes(q))));
  $('count').textContent=shownList.length+' 张专辑';$('grid').replaceChildren();shownA=0;moreAlbums();
  if(!shownList.length)$('grid').textContent=source==='music'?'没有音乐。':'没有音声。文件放在资源库的 media_library/audio/standard 或 nsfw 下，第一级子目录为专辑。';
}
// 专辑分批显示，滚到底部再加载（手机上的音乐有九千多张专辑）
function moreAlbums(){
  for(const a of shownList.slice(shownA,shownA+60)){
    const d=el('div',null,'al'),cv=el('div',null,'cv');coverBox(a,cv);cv.append(el('span',a.tracks.length+' 首','n'));
    d.append(cv,el('b',a.name),el('small',source==='music'?a.artist.trim():''));d.title=a.name;d.onclick=()=>openAlbum(a);$('grid').append(d)}
  shownA+=60;
}
new IntersectionObserver(es=>{if(es[0].isIntersecting&&$('albumView').style.display!=='none'&&shownA<shownList.length)moreAlbums()},{rootMargin:'800px'}).observe($('sent'));
let scrollY0=0;
function openAlbum(a){
  scrollY0=window.scrollY;$('albumView').style.display='none';$('trackView').style.display='block';window.scrollTo(0,0);
  coverBox(a,$('acov'));$('aname').textContent=a.name;$('ainfo').textContent=(a.artist?a.artist.trim()+' · ':'')+a.tracks.length+' 首';
  view=a.tracks;const box=$('list');box.replaceChildren();
  view.forEach((t,i)=>{const r=el('div',null,'tr');r.append(el('span',i+1,'i'),el('span',t.title,'t'));
    r.onclick=()=>playTrack(t);if(cur&&key(cur)===key(t))r.classList.add('on');r.dataset.k=key(t);box.append(r)});
  $('playAll').onclick=()=>playTrack(view[mode==='random'?Math.floor(Math.random()*view.length):0]);
}
function showAlbums(){$('trackView').style.display='none';$('albumView').style.display='block';window.scrollTo(0,scrollY0)}
$('backBtn').onclick=showAlbums;
async function playTrack(t){
  if(cur)await saveProgress();
  cur=t;localStorage.setItem('z6x-au-last',key(t));
  $('player').style.display='block';$('ptitle').textContent=(t.artist?t.artist.trim()+' · ':'')+t.album+' · '+t.title;
  $('pcov').src=cover(t);$('pcov').onerror=()=>$('pcov').removeAttribute('src');
  document.querySelectorAll('.tr').forEach(r=>r.classList.toggle('on',r.dataset.k===key(t)));
  au.src=t.stream_url;au.playbackRate=rate;
  let pos=0;try{const p=await (await fetch('/api/library/audio/progress?key='+enc(key(t)))).json();if(p&&p.pos>5&&(!p.dur||p.pos<p.dur-5))pos=p.pos}catch(e){}
  au.addEventListener('loadedmetadata',()=>{if(pos)au.currentTime=pos},{once:true});
  au.play().catch(()=>{});
  chapters=[];$('chapBtn').style.display='none';
  try{chapters=await (await fetch('/api/library/audio/chapters?source='+t.source+'&rel_path='+enc(t.rel_path))).json()}catch(e){}
  $('chapBtn').style.display=chapters.length?'':'none';
}
function saveProgress(){
  if(!cur||!au.duration)return Promise.resolve();
  return fetch('/api/library/audio/progress',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({key:key(cur),value:{pos:au.currentTime,dur:au.duration,at:Math.floor(Date.now()/1000)}})}).catch(()=>{});
}
function step(d){
  if(!cur||!view.length)return;let i=view.findIndex(t=>key(t)===key(cur));
  if(mode==='random')i=Math.floor(Math.random()*view.length);else i=(i+d+view.length)%view.length;
  playTrack(view[i]);
}
au.onended=()=>{saveProgress();mode==='single'?(au.currentTime=0,au.play()):step(1)};
au.ontimeupdate=()=>{
  if(au.duration){$('seek').value=au.currentTime/au.duration*1000;$('ptime').textContent=fmt(au.currentTime)+' / '+fmt(au.duration)}
  if(++saveTick%40===0)saveProgress();   // 约每 10 秒保存一次
  if(sleepAt&&Date.now()>=sleepAt){au.pause();sleepAt=0;sleepIdx=0;$('sleep').textContent='⏾ 关'}
};
au.onplay=au.onpause=()=>{$('play').textContent=au.paused?'▶':'⏸';if(au.paused)saveProgress()};
$('seek').oninput=()=>{if(au.duration)au.currentTime=$('seek').value/1000*au.duration};
$('play').onclick=()=>au.paused?au.play():au.pause();
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('back').onclick=()=>au.currentTime=Math.max(0,au.currentTime-15);$('fwd').onclick=()=>au.currentTime+=30;
const showMode=()=>$('mode').textContent=MODES.find(m=>m[0]===mode)[1];
$('mode').onclick=()=>{mode=MODES[(MODES.findIndex(m=>m[0]===mode)+1)%3][0];localStorage.setItem('z6x-au-mode',mode);showMode()};
$('rate').onclick=()=>{rate=RATES[(RATES.indexOf(rate)+1)%RATES.length];au.playbackRate=rate;localStorage.setItem('z6x-au-rate',rate);$('rate').textContent=rate+'x'};
$('sleep').onclick=()=>{sleepIdx=(sleepIdx+1)%SLEEPS.length;const m=SLEEPS[sleepIdx];sleepAt=m?Date.now()+m*60000:0;$('sleep').textContent=m?'⏾ '+m+' 分':'⏾ 关'};
$('chapBtn').onclick=()=>{const b=$('chapBox');b.replaceChildren();chapters.forEach((c,i)=>{
  const r=el('div',fmt(c.start)+'  '+c.title,'c');if(au.currentTime>=c.start&&(i===chapters.length-1||au.currentTime<chapters[i+1].start))r.classList.add('on');
  r.onclick=()=>{au.currentTime=c.start;$('chap').style.display='none'};b.append(r)});$('chap').style.display='flex'};
$('chap').onclick=e=>{if(e.target.id==='chap')$('chap').style.display='none'};
$('q').oninput=filter;
$('artist').onchange=()=>{artist=$('artist').value;filter()};
window.addEventListener('pagehide',saveProgress);
showMode();$('rate').textContent=rate+'x';load();
</script></body></html>
