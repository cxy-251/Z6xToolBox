<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>多联放映</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--fg:#e6edf3;--muted:#8b949e;--accent:#2f81f7;--red:#f85149}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:var(--fg);font:14px system-ui,sans-serif}
button,select,input{font:inherit;color:var(--fg)}
button{background:#21262d;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent)}
button.danger{color:var(--red)}
select,input[type=search]{background:#0d1117;border:1px solid var(--line);border-radius:6px;padding:5px 8px}
select{max-width:260px}
#setup{min-height:100%;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;width:100%;max-width:980px}
.head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.head h1{font-size:18px;margin:0;flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.row.disabled{opacity:.35}
.row .num{width:38px;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12px}
.primary{background:var(--accent);border-color:var(--accent);padding:8px 20px;font-size:15px}
#play{display:none;position:fixed;inset:0;background:#000}
#slots{display:flex;width:100%;height:100%}
.slot{flex:1;position:relative;border-left:1px solid #111;overflow:hidden;touch-action:pan-x}
.slot:first-child{border-left:0}
.slot video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.slot.focus::after{content:"";position:absolute;inset:0;border:2px solid var(--accent);pointer-events:none}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12)}
.prog div{height:100%;width:0;background:var(--accent)}
.cap{position:absolute;left:8px;right:8px;bottom:8px;font-size:12px;color:#ddd;text-shadow:0 1px 2px #000;pointer-events:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .3s}
#play.bar .cap{opacity:.9}
#bar{position:absolute;top:0;left:0;right:0;background:rgba(13,17,23,.92);border-bottom:1px solid var(--line);padding:6px 8px;
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;transform:translateY(-110%);transition:transform .2s;z-index:3}
#play.bar #bar{transform:none}
#bar .sep{width:1px;height:22px;background:var(--line)}
#bar .sp{flex:1}
#tag{color:var(--accent);font-weight:bold;min-width:34px}
#arow{display:none;width:100%;gap:6px;align-items:center}
#arow input[type=range]{flex:1;min-width:120px}
#atitle{max-width:30vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
#handle{position:absolute;top:0;left:50%;transform:translateX(-50%);width:80px;height:18px;border-radius:0 0 8px 8px;
  background:rgba(255,255,255,.15);z-index:2;cursor:pointer}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);pointer-events:none}
</style></head><body>
<div id="setup"><div class="card">
  <div class="head"><h1>📺 多联放映</h1>
    <label title="开：没静音的屏里只有焦点屏（点中的那一屏）出声"><input type="checkbox" id="sFocus"> 🎯 焦点出声</label>
    <span><button id="sL2">2 屏</button> <button id="sL3">3 屏</button></span>
    <a href="/ui/library/" style="color:var(--muted)">返回资源库</a></div>
  <div id="rows">加载频道中…</div>
  <div class="foot"><span class="hint" id="stat"></span><button class="primary" id="start" disabled>▶ 开始播放</button></div>
</div></div>

<div id="play">
  <div id="handle" title="显示控制栏"></div>
  <div id="bar">
    <button id="bL2" title="2 屏">2 屏</button><button id="bL3" title="3 屏">3 屏</button>
    <button id="bFocus" title="焦点出声">🎯</button><span class="sep"></span>
    <span id="tag">屏1</span>
    <input type="search" id="bSearch" placeholder="🔍 作者" size="8"><select id="bSel"></select>
    <button id="bPrev" title="上一条（←）">⏮</button><button id="bPlay" title="暂停 / 继续（空格）">⏸</button><button id="bNext" title="下一条（→）">⏭</button>
    <button id="bShuf" title="随机顺序">🔀</button><button id="bLike" title="点赞">♡</button>
    <button id="bMute" title="静音">🔊</button><button id="bSound" title="声音：视频原声 / 音声">🎬</button>
    <span class="sp"></span>
    <button id="bAll" title="全部暂停 / 继续">⏯</button><button id="bFull" title="全屏">⛶</button>
    <button id="bPin" title="固定控制栏">📌</button><button id="bSet" title="回到设置页">⚙</button>
    <div id="arow"><span>🎧</span><button id="aScope"></button><span id="atitle"></span>
      <button id="aPrev">⏮</button><button id="aNext">⏭</button><button id="aMode"></button>
      <input type="range" id="aSeek" min="0" max="1000" value="0"><span id="aTime" class="hint">0:00</span></div>
  </div>
  <div id="slots"></div>
</div>

<script>
const $=id=>document.getElementById(id), enc=encodeURIComponent;
const PAGE=300, N=3;
const MODES={list:'🔁 列表',single:'🔂 单曲',random:'🔀 随机'};
let channels=[], scopes=[], cfg=null, active=0, pinned=false, hideTimer=0;
const S=Array.from({length:N},()=>({total:0,base:0,page:[],cur:0,seed:0,skips:0,landscape:0,tracks:[],tscope:null,ti:0}));
const el=(t,txt,cls)=>{const e=document.createElement(t);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e};
const api=(u,o)=>fetch(u,o).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
const newSeed=()=>1+Math.floor(Math.random()*1e9);

// ---------- 频道下拉 ----------
function fillSelect(sel,selected,q){
  q=(q||'').trim().toLowerCase(); sel.replaceChildren(); const groups={};
  for(const c of channels){ if(q&&c.id!==selected&&!c.label.toLowerCase().includes(q))continue; (groups[c.group]=groups[c.group]||[]).push(c) }
  for(const g in groups){const og=el('optgroup');og.label=g;for(const c of groups[g]){const o=el('option',c.label);o.value=c.id;if(c.id===selected)o.selected=true;og.append(o)}sel.append(og)}
}
function searchBox(sel,onPick){
  const s=el('input');s.type='search';s.placeholder='🔍 作者';s.size=8;
  s.oninput=()=>{const cur=sel.value;fillSelect(sel,cur,s.value);const hits=[...sel.options].filter(o=>o.value!==cur);
    if(s.value.trim()&&hits.length===1){sel.value=hits[0].value;onPick(sel.value)}};
  return s;
}
const scopeLabel=id=>{const s=scopes.find(x=>x.id===id)||scopes[0];return s?s.label+' ('+s.count+')':'全部音声'};
const nextOf=(arr,v)=>arr[(arr.indexOf(v)+1)%arr.length];

// ---------- 设置页 ----------
async function showSetup(){
  $('play').style.display='none';$('setup').style.display='flex';
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  try{
    const [ch,c]=await Promise.all([channels.length?null:api('/api/library/matrix/channels'),api('/api/library/matrix/config')]);
    if(ch){channels=ch.channels;scopes=ch.audio_scopes}
    cfg=c;
  }catch(e){$('rows').textContent='加载失败：'+e.message;return}
  const total=(channels.find(c=>c.id==='all')||{}).count||0;
  $('stat').textContent=total?'共 '+total+' 条短视频，'+((scopes[0]||{}).count||0)+' 条音声':'资源库中还没有短视频（media_library/shortvideo/抖音、快手、TikTok）';
  renderRows(); setLayout(cfg.layout); $('sFocus').checked=cfg.focus_audio; pinned=cfg.bar_pinned; $('start').disabled=!total;
}
function renderRows(){
  const box=$('rows');box.replaceChildren();
  cfg.slots.forEach((s,i)=>{
    const r=el('div',null,'row');r.id='row'+i;
    const sel=el('select');fillSelect(sel,s.channel_id);sel.onchange=()=>s.channel_id=sel.value;
    const chk=(txt,key)=>{const l=el('label');const c=el('input');c.type='checkbox';c.checked=s[key];c.onchange=()=>s[key]=c.checked;l.append(c,' '+txt);return l};
    const bV=el('button','🎬 原声'),bA=el('button','🎧 音声'),bSc=el('button'),bMo=el('button');
    const upd=()=>{bV.className=s.sound!=='audio'?'on':'';bA.className=s.sound==='audio'?'on':'';
      bSc.textContent='📚 '+scopeLabel(s.audio_scope);bMo.textContent=MODES[s.audio_mode];
      bSc.style.display=bMo.style.display=s.sound==='audio'?'':'none'};
    bV.onclick=()=>{s.sound='video';upd()};bA.onclick=()=>{s.sound='audio';upd()};
    bSc.title='点击切换到下一个专辑';bSc.onclick=()=>{s.audio_scope=nextOf(scopes.map(x=>x.id),s.audio_scope);upd()};
    bMo.onclick=()=>{s.audio_mode=nextOf(Object.keys(MODES),s.audio_mode);upd()};
    upd();
    r.append(el('span','屏 '+(i+1),'num'),searchBox(sel,v=>s.channel_id=v),sel,chk('🔀 随机','shuffle'),chk('🔇 静音','muted'),bV,bA,bSc,bMo);
    box.append(r);
  });
}
function setLayout(n){cfg.layout=n===2?2:3;$('sL2').className=cfg.layout===2?'on':'';$('sL3').className=cfg.layout===3?'on':'';
  const r=$('row2');if(r)r.classList.toggle('disabled',cfg.layout===2)}
const saveCfg=()=>fetch('/api/library/matrix/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)}).catch(()=>{});

// ---------- 播放 ----------
const V=i=>$('v'+i), A=i=>$('a'+i);
function buildSlots(){
  const box=$('slots');box.replaceChildren();
  for(let i=0;i<N;i++){
    const d=el('div',null,'slot');d.id='slot'+i;
    const v=el('video');v.id='v'+i;v.playsInline=true;v.preload='auto';
    const p=el('div',null,'prog');const pb=el('div');pb.id='p'+i;p.append(pb);
    const cap=el('div','','cap');cap.id='c'+i;
    const a=el('audio');a.id='a'+i;a.preload='none';
    d.append(v,p,cap,a);box.append(d);
    d.onclick=()=>focusSlot(i);
    v.onended=()=>step(i,1);
    v.onplay=v.onpause=()=>{if(i===active)refreshBar();syncAudio()};
    v.onplaying=()=>{S[i].skips=0};
    v.ontimeupdate=()=>{if(v.duration)pb.style.width=(v.currentTime/v.duration*100)+'%'};
    // 横屏视频在竖长的分屏里只剩一条缝：读到尺寸后跳过（连续 30 条都是横屏则停下）
    v.onloadedmetadata=()=>{if(v.videoWidth>v.videoHeight){if(++S[i].landscape<=30)step(i,1)}else S[i].landscape=0};
    v.onerror=()=>{if(!v.getAttribute('src'))return;if(++S[i].skips>Math.min(5,S[i].total)){$('c'+i).textContent='连续多条无法播放，已停止';return}setTimeout(()=>step(i,1),300)};
    a.onended=()=>astep(i,1);
    a.ontimeupdate=()=>{if(i===active)refreshAudioRow()};
    // 手机：在某一屏上下滑动换条
    let y0=null;d.addEventListener('touchstart',e=>{y0=e.touches[0].clientY},{passive:true});
    d.addEventListener('touchend',e=>{if(y0==null)return;const dy=e.changedTouches[0].clientY-y0;y0=null;if(Math.abs(dy)>60){focusSlot(i);step(i,dy<0?1:-1)}});
  }
}
async function start(){
  await saveCfg();
  $('setup').style.display='none';$('play').style.display='block';
  buildSlots();
  for(let i=0;i<N;i++){$('slot'+i).style.display=i<cfg.layout?'':'none';S[i].total=0;S[i].seed=cfg.slots[i].shuffle?newSeed():0;S[i].tracks=[]}
  fillSelect($('bSel'),cfg.slots[0].channel_id);
  active=-1;focusSlot(0);showBar(3000);
  for(let i=0;i<cfg.layout;i++)setTimeout(()=>loadChannel(i),i*200);
}
async function fetchPage(i,offset){
  const s=cfg.slots[i],r=await api('/api/library/matrix/videos?channel_id='+enc(s.channel_id)+'&seed='+S[i].seed+'&offset='+offset+'&limit='+PAGE);
  S[i].total=r.total;S[i].base=r.offset;S[i].page=r.videos;
}
async function loadChannel(i){
  const st=S[i];st.cur=0;st.skips=0;st.landscape=0;
  try{await fetchPage(i,0)}catch(e){$('c'+i).textContent='读取失败：'+e.message;return}
  if(!st.total){V(i).removeAttribute('src');$('c'+i).textContent='这个频道没有视频';refreshBar();return}
  play(i);
}
const curItem=i=>S[i].page[S[i].cur-S[i].base];
async function play(i){
  const st=S[i];
  if(st.cur<st.base||st.cur>=st.base+st.page.length){try{await fetchPage(i,Math.floor(st.cur/PAGE)*PAGE)}catch(e){return}}
  const it=curItem(i);if(!it)return;
  const v=V(i);v.src=it.stream_url;$('c'+i).textContent=(st.cur+1)+'/'+st.total+'  '+it.folder+' · '+it.title;
  applySound();v.play().catch(()=>{});
  if(i===active)refreshBar();
  if(cfg.slots[i].sound==='audio'&&!S[i].tracks.length)loadTracks(i);
}
function step(i,d){const st=S[i];if(!st.total)return;st.cur=(st.cur+d+st.total)%st.total;play(i)}
function focusSlot(i){
  if(i===active)return;active=i;
  for(let k=0;k<N;k++){const s=$('slot'+k);if(s)s.classList.toggle('focus',k===i&&cfg.layout>1)}
  applySound();refreshBar();
}
// 声音 = 手动静音 或（焦点出声 且 不是焦点屏）；用音声的屏，视频本身始终静音
const audible=i=>!cfg.slots[i].muted&&!(cfg.focus_audio&&i!==active);
function applySound(){for(let i=0;i<N;i++){const v=V(i);if(!v)continue;v.muted=!audible(i)||cfg.slots[i].sound==='audio'}syncAudio()}
// 音声：这一屏听得到且视频在播放时才播放，否则暂停，回来接着放
function syncAudio(){
  for(let i=0;i<cfg.layout;i++){
    const a=A(i);if(!a)continue;
    const want=cfg.slots[i].sound==='audio'&&audible(i)&&!V(i).paused&&S[i].tracks.length;
    if(want&&a.paused){if(!a.getAttribute('src'))setTrack(i);a.play().catch(()=>{})}
    else if(!want&&!a.paused)a.pause();
  }
}
async function loadTracks(i){
  const s=cfg.slots[i];
  try{S[i].tracks=(await api('/api/library/matrix/audio?scope='+enc(s.audio_scope))).tracks}catch(e){S[i].tracks=[]}
  S[i].ti=s.audio_mode==='random'?Math.floor(Math.random()*S[i].tracks.length):0;
  A(i).removeAttribute('src');syncAudio();refreshAudioRow();
}
function setTrack(i){const t=S[i].tracks[S[i].ti];if(t)A(i).src=t.stream_url}
function astep(i,d){
  const st=S[i],n=st.tracks.length;if(!n)return;const mode=cfg.slots[i].audio_mode;
  if(mode==='random')st.ti=Math.floor(Math.random()*n);else if(mode==='list'||d!==1)st.ti=(st.ti+d+n)%n;
  setTrack(i);A(i).currentTime=0;syncAudio();refreshAudioRow();
}

// ---------- 顶栏（焦点屏） ----------
function refreshBar(){
  const i=active,s=cfg.slots[i];if(!s)return;
  $('tag').textContent='屏'+(i+1);
  if($('bSel').value!==s.channel_id)fillSelect($('bSel'),s.channel_id,$('bSearch').value);
  $('bPlay').textContent=V(i)&&!V(i).paused?'⏸':'▶';
  $('bShuf').className=s.shuffle?'on':'';
  const it=curItem(i);$('bLike').textContent=it&&it.liked?'❤️':'♡';
  $('bMute').textContent=s.muted?'🔇':'🔊';$('bMute').className=s.muted?'danger':'';
  $('bSound').textContent=s.sound==='audio'?'🎧':'🎬';$('bSound').className=s.sound==='audio'?'on':'';
  $('bL2').className=cfg.layout===2?'on':'';$('bL3').className=cfg.layout===3?'on':'';
  $('bFocus').className=cfg.focus_audio?'on':'';$('bPin').className=pinned?'on':'';
  $('arow').style.display=s.sound==='audio'?'flex':'none';refreshAudioRow();
}
const fmt=t=>{t=Math.floor(t||0);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function refreshAudioRow(){
  const i=active,s=cfg.slots[i];if(!s||s.sound!=='audio')return;
  const t=S[i].tracks[S[i].ti],a=A(i);
  $('aScope').textContent='📚 '+scopeLabel(s.audio_scope);$('aMode').textContent=MODES[s.audio_mode];
  $('atitle').textContent=t?t.album+' · '+t.title:'（这个范围没有音声）';
  if(a&&a.duration){$('aSeek').value=a.currentTime/a.duration*1000;$('aTime').textContent=fmt(a.currentTime)+' / '+fmt(a.duration)}
}
function showBar(ms){const p=$('play');p.classList.add('bar');clearTimeout(hideTimer);if(!pinned)hideTimer=setTimeout(()=>p.classList.remove('bar'),ms||1500)}
const bind=(id,fn)=>$(id).onclick=e=>{e.stopPropagation();fn();refreshBar();showBar(4000)};
bind('bPrev',()=>step(active,-1));bind('bNext',()=>step(active,1));
bind('bPlay',()=>{const v=V(active);v.paused?v.play().catch(()=>{}):v.pause()});
bind('bShuf',()=>{const s=cfg.slots[active];s.shuffle=!s.shuffle;S[active].seed=s.shuffle?newSeed():0;saveCfg();loadChannel(active)});
bind('bLike',async()=>{const it=curItem(active);if(!it)return;
  try{const r=await api('/api/library/shortvideo/like?platform='+enc(it.platform)+'&rel_path='+enc(it.rel_path)+'&liked='+(it.liked?0:1),{method:'POST'});it.liked=r.liked;refreshBar()}catch(e){}});
bind('bMute',()=>{const s=cfg.slots[active];s.muted=!s.muted;applySound();saveCfg()});
bind('bSound',()=>{const s=cfg.slots[active];s.sound=s.sound==='audio'?'video':'audio';if(s.sound==='audio'&&!S[active].tracks.length)loadTracks(active);applySound();saveCfg()});
bind('bFocus',()=>{cfg.focus_audio=!cfg.focus_audio;applySound();saveCfg()});
bind('bL2',()=>relayout(2));bind('bL3',()=>relayout(3));
bind('bAll',()=>{const vs=[...Array(cfg.layout).keys()].map(V);const anyPlaying=vs.some(v=>!v.paused);vs.forEach(v=>anyPlaying?v.pause():v.play().catch(()=>{}))});
bind('bFull',()=>{document.fullscreenElement?document.exitFullscreen():$('play').requestFullscreen().catch(()=>{})});
bind('bPin',()=>{pinned=!pinned;cfg.bar_pinned=pinned;saveCfg()});
$('bSet').onclick=()=>{for(let i=0;i<N;i++){const v=V(i),a=A(i);if(v){v.pause();v.removeAttribute('src');v.load()}if(a){a.pause();a.removeAttribute('src')}}showSetup()};
$('bSel').onchange=()=>{cfg.slots[active].channel_id=$('bSel').value;saveCfg();loadChannel(active)};
$('bSearch').oninput=()=>{const sel=$('bSel'),cur=sel.value;fillSelect(sel,cur,$('bSearch').value);const hits=[...sel.options].filter(o=>o.value!==cur);
  if($('bSearch').value.trim()&&hits.length===1){sel.value=hits[0].value;sel.onchange()}};
$('aScope').onclick=e=>{e.stopPropagation();const s=cfg.slots[active];s.audio_scope=nextOf(scopes.map(x=>x.id),s.audio_scope);saveCfg();A(active).pause();loadTracks(active)};
$('aMode').onclick=e=>{e.stopPropagation();const s=cfg.slots[active];s.audio_mode=nextOf(Object.keys(MODES),s.audio_mode);saveCfg();refreshAudioRow()};
$('aPrev').onclick=e=>{e.stopPropagation();astep(active,-1)};$('aNext').onclick=e=>{e.stopPropagation();astep(active,1)};
$('aSeek').oninput=()=>{const a=A(active);if(a&&a.duration)a.currentTime=$('aSeek').value/1000*a.duration};
function relayout(n){
  const old=cfg.layout;cfg.layout=n;saveCfg();
  for(let i=0;i<N;i++)$('slot'+i).style.display=i<n?'':'none';
  if(n<old){V(2).pause();A(2).pause();if(active===2)focusSlot(0)}
  else if(n>old&&!S[2].total)loadChannel(2);
  else if(n>old)V(2).play().catch(()=>{});
  applySound();
}
$('handle').onclick=$('handle').onmouseenter=()=>showBar(4000);
$('bar').onmouseenter=()=>{clearTimeout(hideTimer);$('play').classList.add('bar')};
$('bar').onmouseleave=()=>showBar(1500);
document.addEventListener('mousemove',e=>{if($('play').style.display==='block'&&e.clientY<24)showBar(2000)});
document.addEventListener('keydown',e=>{
  if($('play').style.display!=='block'||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.key===' '){e.preventDefault();$('bPlay').click()}
  else if(e.key==='ArrowRight'||e.key==='ArrowDown')step(active,1);
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')step(active,-1);
  else if(e.key>='1'&&e.key<=String(cfg.layout))focusSlot(+e.key-1);
  else if(e.key==='m')$('bMute').click();
});
