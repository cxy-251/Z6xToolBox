# z6x-hub 投影仪配置示例。./hub/deploy.sh projector 首次运行时复制为 devices/projector.yaml 并生成随机 token。
# devices/*.yaml 含 token，已加入 .gitignore，不要提交。

name: 投影仪
# 投影仪自己的浏览器（TV Bro）访问 hub 不需要 token；保存配置仍需要 token。
trust_local: true
listen: ":8090"
token: "换成随机长字符串"
password: z6x888   # 浏览器登录密码（可选，至少 4 个字符）；接口与网络指纹仍使用 token
# login_days: 180   # 浏览器登录后保持多少天（180）
data_dir: data
log_file: hub.log

# 网络：只在 Wi-Fi 的局域网 IPv4 地址上对外服务，不监听 IPv6 公网地址。
# 投影仪不会离开家，无需配置 trusted；手机的配置见 phone.example.yaml。
network:
  iface: wlan0

modules:
  # 文件共享：WebDAV 在独立端口，HTTP 下载和上传在主端口。
  files:
    enable: true
    port: 8091
    usb: true                     # 自动共享插入的 U 盘（/storage/<卷ID>）
    roots:
      - { name: 内部存储, path: /storage/emulated/0 }

  # 手机发送文字和链接到电视。
  paste:
    enable: true

  # 网页遥控器与控制接口。
  control:
    enable: true
    apps:
      SmartTube: org.smarttube.stable
      TV Bro: com.phlox.tvwebbrowser
      Clash: com.github.metacubex.clash.meta
    macros:
      回到桌面并静音: { keys: [home, mute], interval_ms: 300 }

  # 网络唤醒：在下面添加设备（MAC 必填，IP 用于显示在线状态）。
  wol:
    enable: true
    devices: {}
    #  书房电脑: { mac: "AA:BB:CC:DD:EE:FF", ip: 192.168.0.20 }

  # 系统状态。
  metrics:
    enable: true
    interval_sec: 5

  # 局域网测速。
  speed:
    enable: true

  # 局域网设备扫描（SSDP）。
  # 资源库：网页游戏、漫画、短视频（与 omni-deck 相同的目录结构，自动发现机身存储和 U 盘上的资源库）。
  library:
    enable: true   # 首页为资源页；投影仪上没有资源时只显示工具、存储、设置，插上带资源库的 U 盘后内容自动出现

  # 发送通知到电视的通知界面（不弹出提醒）。
  notify:
    enable: true

  lanscan:
    enable: true
    timeout_sec: 3

  # 网页终端：相当于把 shell 权限开放给网页，默认关闭。
  # 启用时必须在 allow_from 中列出允许访问的 IP 或网段。
  webshell:
    enable: false
    allow_from: []          # 例如 [192.168.0.21]
    max_sessions: 3

  # 任务管理：相当于手机的最近任务界面（极米去掉了投影仪的最近任务）。
  tasks:
    enable: true
    protect: [com.github.metacubex.clash.meta]   # 不允许结束的应用；桌面、输入法自动受保护

  # SSH：以 hub 的身份（shell，uid 2000）登录，权限与 adb shell 相同；只接受密钥登录，只在局域网地址上监听。
  sshd:
    enable: true
    port: 8022
    authorized_keys:
      - "ecdsa-sha2-nistp256 AAAA…（Deck 的公钥，cat ~/.ssh/z6x_ecdsa.pub） deck"

  # 遥控器按键：在网页上设置四个影视快捷键的短按与长按（由 z6x-tools 的 keymap 守护进程执行）。
  keys:
    enable: true

  # Clash 白名单：在原配置的规则前加白名单直连规则，作为订阅地址 http://127.0.0.1:8090/clash/profile.yaml 交给 Clash。
  # 原配置（上传的文件或订阅链接）与白名单在「🔧 工具 → Clash 白名单」中设置，保存在数据目录。
  clash:
    enable: true

  # AirPlay 音箱：苹果设备在「音频输出」中选择本设备即可推送声音（AirPlay 1 音频）。在「🔧 工具 → AirPlay 音箱」中开关。
  # 投影仪上 hub 是 shell 身份，借 run-as 以 Termux 的身份播放（需在 Termux 中安装 pulseaudio）。
  airplay:
    enable: true
    run_as_termux: true

  # 后台任务：设备上的后台脚本，可在「工具 → 后台任务」中启动、停止，并设置是否随 hub 启动。
  # 开机时只需启动 hub，由 hub 启动 autostart 的任务（网页上修改的开关保存在 data/jobs_autostart.json）。
  jobs:
    enable: true
    items:
      - id: keymap
        title: 遥控器按键重映射
        help: 识别影视快捷键与调焦旁键的短按、长按并执行动作；动作在「遥控器按键」页中设置
        start: /data/local/tmp/z6x-tools/keymapd.sh start
        stop: /data/local/tmp/z6x-tools/keymapd.sh stop
        status: /data/local/tmp/z6x-tools/keymapd.sh status
        log: /data/local/tmp/z6x-tools/keymap.log
        autostart: true
