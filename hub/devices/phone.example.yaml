# z6x-hub 手机配置示例（Redmi Note 12 Turbo）。./hub/deploy.sh phone 首次运行时复制为 devices/phone.yaml 并生成随机 token。
# 手机作为资源库：网页游戏、漫画、短视频。遥控、发送文字、网络唤醒只对电视有意义，不在手机上启用。
# devices/*.yaml 含 token，已加入 .gitignore，不要提交。

token: "换成随机长字符串"
password: z6x888   # 浏览器登录密码（可选，至少 4 个字符）；接口与网络指纹仍使用 token
# login_days: 180   # 浏览器登录后保持多少天（180）
name: 手机
listen: ":8090"
data_dir: data
log_file: hub.log

# 网络：只在 Wi-Fi 的局域网 IPv4 地址上对外服务，不监听 IPv6 公网地址和移动数据网络。
# trusted 为可信 Wi-Fi 的指纹：在家里执行 ./hub/ctl.sh phone trust 自动添加。
# 连到其他 Wi-Fi 或断开 Wi-Fi 时 hub 自动停止对外服务，回到家里 15 秒内自动恢复。
network:
  iface: wlan0
  trusted: []
  # 127.0.0.1:8090 常开：手机自己的浏览器不连网络也能使用（只有本机能访问，同样需要密码）。设为 false 关闭。
  # loopback: true

modules:
  # 资源库：与 omni-deck 相同的目录结构，位于机身存储的 omni_library/。
  library:
    enable: true
    # 资源库以外的音乐目录（歌手/专辑/歌曲），在音声页作为「音乐」来源
    music:
      - /storage/emulated/0/000OFFLINE_document/music
    # 以下参数都可以不写，不写时使用括号中的默认值（默认值定义在 library.DefaultConfig）
    # 短视频播放器中图集自动翻页的间隔（秒），最后一张之后切换到下一个作品（1）
    slide_seconds: 1
    # rescan_minutes: 10        # 短视频与音声的扫描结果多久后过期、在后台重新扫描（10 分钟）
    # page_size: 48             # 短视频网格每次加载的作品数（48）
    # cover_px: 300             # 音乐封面缩小后的宽度（300 像素）
    # player_hide_seconds: 2.5  # 短视频播放器无操作多久后隐藏控件（2.5 秒）
    # 短视频封面在手机上生成（thumbs.sh），按机身温度调速；每轮开始时读取，改后下一轮生效
    # thumbs:
    #   jobs: 3                 # 不热时同时运行的 ffmpeg 数（3）
    #   cool: 36                # 低于此温度（°C）全速；介于 cool 与 hot 之间只运行 1 个（36）
    #   hot: 40                 # 达到此温度（°C）暂停，降到 cool+1 以下再继续（40）
    #   width: 360              # 封面宽度（360 像素）
    #   interval_hours: 6       # 每轮之间等待多久再检查新作品（6 小时）

  # 文件共享：用于向资源库批量拷贝内容（WebDAV 在 8091 端口）。
  files:
    enable: true
    port: 8091
    usb: false
    roots:
      - { name: 内部存储, path: /storage/emulated/0 }

  # 系统状态：查看手机存储余量、温度和内存。
  metrics:
    enable: true
    interval_sec: 10

  # 局域网测速：判断手机的 Wi-Fi 速度是否够用。
  speed:
    enable: true

  # 后台任务：设备上的后台脚本，可在「工具 → 后台任务」中启动、停止，并设置是否随 hub 启动。
  # 开机时只需启动 hub，由 hub 启动 autostart 的任务（网页上修改的开关保存在 data/jobs_autostart.json）。
  jobs:
    enable: true
    items:
      - id: thumbs
        title: 短视频封面生成
        help: 为资源库中的短视频生成封面（放在作品目录的 .thumbs/），按机身温度调速、过热暂停；参数在「设置」中修改
        start: ./thumbs.sh start
        stop: ./thumbs.sh stop
        status: ./thumbs.sh status
        log: thumbs.log
        autostart: true
