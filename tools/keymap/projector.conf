# 投影仪遥控器按键重映射（z6x keymap）。修改后执行 ./tools/keymap.sh projector 生效。
# 触发：press:<极米快捷键>（短按）、long:<键名>（长按，普通键松开时仍有原来的效果）
# 动作：sh: <命令>、key: <键名>…

# 遥控器上的四个影视快捷键（原本打开酷喵、云视听极光、奇异果、芒果，这些应用均未安装）
press:youku   = sh: am start -n org.smarttube.stable/com.liskovsoft.smartyoutubetv2.tv.ui.main.SplashActivity
press:jiguang = sh: am start -n com.phlox.tvwebbrowser/.activity.main.MainActivity
press:qiyiguo = sh: am start -n com.cxinventor.file.explorer/com.alphainventor.filemanager.activity.MainActivity
press:mango   = sh: am start -n org.galexander.sshd/.SimpleSSHDTV
