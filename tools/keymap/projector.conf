# 遥控器按键设置：由 z6x-hub「遥控器按键」页面生成，手工修改会在下次保存时被覆盖。
# 格式见 z6x keymap --help；keymap 守护进程在本文件修改后 2 秒内自动重新加载。

press:youku = sh: am start -n com.cxinventor.file.explorer/com.alphainventor.filemanager.activity.MainActivity
long:youku = sh: am start -n de.szalkowski.activitylauncher.oss/de.szalkowski.activitylauncher.entrypoint.MainActivity
press:jiguang = sh: am start -n org.smarttube.stable/com.liskovsoft.smartyoutubetv2.tv.ui.main.SplashActivity
long:jiguang = sh: am start -n com.xgimi.filemanager/com.xgimi.module.home.HomeActivity
press:qiyiguo = sh: am start -n com.phlox.tvwebbrowser/.activity.main.MainActivity
long:qiyiguo = sh: am start -n com.xgimi.manager/.ui.activitys.MainActivity
press:mango = sh: am start -a android.intent.action.VIEW -d http://192.168.0.109:8090/ui/tasks/ -n com.phlox.tvwebbrowser/.activity.main.MainActivity
long:mango = sh: am start -n com.xgimi.wirelessscreen/.activity.NewMainActivity
